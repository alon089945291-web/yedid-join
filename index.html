<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המהדורה השבועית של ידיד נפש⚡</title>
<meta name="description" content="פעם בשבוע, המסרים הכי מחזקים של ערוץ ידיד נפש – ישר למייל.">
<meta property="og:title" content="המהדורה השבועית של ידיד נפש⚡">
<meta property="og:description" content="פעם בשבוע, המסרים הכי מחזקים של הערוץ – ישר למייל. מצטרפים בשנייה.">
<meta property="og:image" content="https://hel1.your-objectstorage.com/chatfree-yedid-nefsh/20/d8/20d8c22e886213c914c0f366cf8f3bd54f2f2182f19fb12858ddc68aaf111e99">
<link rel="icon" href="https://hel1.your-objectstorage.com/chatfree-yedid-nefsh/20/d8/20d8c22e886213c914c0f366cf8f3bd54f2f2182f19fb12858ddc68aaf111e99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Rubik,Heebo,Arial,sans-serif;color:#1b2340;background:#eef2fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 14px;
  background-image:radial-gradient(circle at 15% 10%,rgba(91,141,239,.25),transparent 40%),radial-gradient(circle at 90% 90%,rgba(242,139,48,.22),transparent 42%)}
.card{width:min(440px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(27,35,64,.16);animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.top{background:linear-gradient(135deg,#3a6bc9,#5b8def 55%,#f28b30);color:#fff;text-align:center;padding:34px 26px 28px;position:relative}
.logo{width:86px;height:86px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.85);box-shadow:0 8px 22px rgba(0,0,0,.18);background:#fff;display:block;margin:0 auto 14px}
h1{margin:0;font-size:25px;font-weight:800;line-height:1.3}
.top p{margin:8px 0 0;font-size:15.5px;line-height:1.6;opacity:.95}
.perks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.perks span{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:13px}
.bd{padding:24px 24px 22px}
label{display:block;font-size:13.5px;color:#6b7385;margin:0 2px 7px}
input{display:block;width:100%;border:2px solid #e6e9f0;border-radius:16px;padding:14px 16px;font:17px Rubik,Arial,sans-serif;color:#1b2340;outline:none;direction:ltr;text-align:left;transition:.15s}
input:focus{border-color:#3a6bc9;box-shadow:0 0 0 4px #e3ecfb}
input.er{border-color:#e05656;box-shadow:0 0 0 4px #fde3e3}
.em{min-height:20px;font-size:13.5px;color:#d14343;margin:6px 2px 0}
.go{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:6px;padding:15px 0;border-radius:999px;background:#3a6bc9;color:#fff;font-size:17px;font-weight:700;box-shadow:0 10px 24px rgba(58,107,201,.32);transition:.15s}
.go:hover{background:#2f5aaf;transform:translateY(-1px)}
.go[disabled]{opacity:.7;cursor:default;transform:none}
.sp{width:19px;height:19px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.nt{margin:12px 0 0;font-size:12.5px;color:#8a92a6;text-align:center;line-height:1.6}
.ok{text-align:center;padding:4px 0 2px}
.ck{width:68px;height:68px;border-radius:50%;background:#e7f6ee;color:#1f9d63;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:34px;animation:pop .45s ease}
.ok b{display:block;font-size:21px;margin:12px 0 4px}
.ok p{margin:0;font-size:14.5px;color:#6b7385;line-height:1.6}
.ok .addr{direction:ltr;display:inline-block;color:#3a6bc9;font-weight:600}
.sh{margin-top:20px;padding-top:18px;border-top:1px dashed #e3e7ef;text-align:center}
.sh small{display:block;font-size:13px;color:#8a92a6;margin-bottom:10px}
.sbt{display:flex;flex-direction:column;gap:9px}
.sb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid #eef0f4;text-align:right;transition:.15s}
.sb:hover{border-color:#3a6bc9;background:#f6f9ff}
.sb i{font-style:normal;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sb b{display:block;font-size:15px;color:#1b2340}
.sb span{display:block;font-size:12.5px;color:#8a92a6;margin-top:1px}
.foot{text-align:center;margin-top:18px;font-size:13px;color:#8a92a6}
.foot a{color:#3a6bc9;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <img class="logo" alt="ידיד נפש" src="https://hel1.your-objectstorage.com/chatfree-yedid-nefsh/20/d8/20d8c22e886213c914c0f366cf8f3bd54f2f2182f19fb12858ddc68aaf111e99">
    <h1>המהדורה השבועית<br>של ידיד נפש⚡</h1>
    <p>פעם בשבוע, המסרים הכי מחזקים של הערוץ – ישר למייל.</p>
    <div class="perks"><span>💪 חיזוק ועידוד</span><span>📬 פעם בשבוע</span><span>🤍 ללא עלות</span></div>
  </div>
  <div class="bd" id="bd">
    <label for="em">כתובת המייל</label>
    <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com">
    <div class="em" id="err"></div>
    <button class="go" id="go">הצטרפות למהדורה</button>
    <p class="nt">שימו לב לרשום את הכתובת בדיוק. אפשר להסיר את עצמכם בכל עת.</p>
  </div>
  <div class="bd" style="padding-top:0">
    <div class="sh">
      <small>מכירים מישהו שזה יכול לחזק? שתפו 💌</small>
      <div class="sbt">
        <button class="sb" id="sm"><i style="background:#fdecea">✉️</i><div><b>שליחה במייל</b><span>נפתח מייל מוכן, רק לבחור למי</span></div></button>
        <button class="sb" id="sc"><i style="background:#e9f0fd">🔗</i><div><b>העתקת הקישור</b><span>להדבקה בכל מקום</span></div></button>
      </div>
    </div>
    <div class="foot">מבית <a href="https://yedid-nefesh.com/" target="_blank" rel="noopener">ערוץ ידיד נפש⚡</a></div>
  </div>
</main>
<script>
(function () {
  var POST = "https://docs.google.com/forms/d/e/1FAIpQLSfD6YrYfee_XOWBE1cPt9BA8iYAfM9fZEhdiUkWlBt3GEpMGw/formResponse",
      FIELD = "entry.229745151",
      FALLBACK = "https://docs.google.com/forms/d/1w14TWMou8ojjHW1iR7HgnvJeKARjoacgq_MnwaelRAQ/viewform",
      HERE = location.href.split("#")[0].split("?")[0];
  var em = document.getElementById("em"), err = document.getElementById("err"), go = document.getElementById("go");
  em.addEventListener("input", function () { err.textContent = ""; em.classList.remove("er"); });
  em.addEventListener("keydown", function (e) { if (e.key == "Enter") send(); });
  go.addEventListener("click", send);
  function send() {
    var v = em.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)) { err.textContent = "נראה שהכתובת לא תקינה, בדקו שוב"; em.classList.add("er"); em.focus(); return; }
    go.disabled = true; go.innerHTML = '<span class="sp"></span>שולח…';
    var body = new URLSearchParams(); body.append(FIELD, v);
    fetch(POST, { method: "POST", mode: "no-cors", body: body }).then(function () {
      var bd = document.getElementById("bd");
      bd.innerHTML = '<div class="ok"><div class="ck">✓</div><b>נרשמתם בהצלחה!</b><p>מעכשיו המהדורה השבועית תגיע אל:<br><span class="addr"></span></p></div>';
      bd.querySelector(".addr").textContent = v;
    }).catch(function () {
      go.disabled = false; go.textContent = "הצטרפות למהדורה";
      err.innerHTML = 'משהו השתבש בשליחה. נסו שוב, או <a href="' + FALLBACK + '" target="_blank" rel="noopener">הירשמו כאן</a>.';
    });
  }
  function mailUrl() {
    return "https://mail.google.com/mail/?view=cm&fs=1&tf=1&su=" + encodeURIComponent("משהו קטן שחשבתי שיעשה לך טוב") +
      "&body=" + encodeURIComponent("היי,\n\nכל שבוע מגיעה אליי למייל המהדורה של ערוץ ידיד נפש – כמה דקות של חיזוק ומחשבות טובות לשבוע.\nחשבתי עליך כשקראתי אותה, אז רציתי לשתף.\n\nאם מתאים לך, אפשר להצטרף כאן:\n" + HERE + "\n\nשבוע טוב!");
  }
  document.getElementById("sm").onclick = function () {
    var w = 620, h = 680, u = mailUrl();
    var win = window.open(u, "ynsmail", "width=" + w + ",height=" + h + ",left=" + Math.max(0, (screen.width - w) / 2) + ",top=" + Math.max(0, (screen.height - h) / 2));
    if (!win) location.href = u;
  };
  document.getElementById("sc").onclick = function () {
    var b = this;
    function ok() { b.querySelector("b").textContent = "✓ הקישור הועתק!"; b.querySelector("span").textContent = "עכשיו אפשר להדביק ולשלוח"; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(HERE).then(ok, function () { prompt("העתיקו את הקישור:", HERE); });
    else prompt("העתיקו את הקישור:", HERE);
  };
})();
</script>
</body>
</html>
